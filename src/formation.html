<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Aria Academy · Espace formation</title>
<link rel="icon" href="__MONO__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@600;700;800&family=Wix+Madefor+Text:wght@400;500;600;700&display=swap">
<style>
:root{
  --blue:#0A22AE;--blue-deep:#071A8C;--blue-btn:#2F5FD8;--cream:#F4F1EA;--paper:#FBFAF6;--orange:#F0993F;--orange-soft:#FCE7CF;
  --ink:#16237A;--muted:#5561A8;--line:rgba(10,34,174,.14);--ok:#1E7B45;
  --display:"Wix Madefor Display","Helvetica Neue",Arial,sans-serif;--text:"Wix Madefor Text","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 var(--text);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;color:var(--blue);text-wrap:balance}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font:600 15px var(--text);background:var(--blue);color:var(--cream);text-decoration:none}
.btn:hover{background:var(--blue-btn)}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
.btn.orange{background:var(--orange);color:var(--blue-deep)}
.btn.done{background:#E3F4E8;color:var(--ok)}
input{font:16px var(--text);color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:12px;width:100%}
input:focus{outline:none;border-color:var(--blue)}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.msg{padding:10px 14px;border-radius:8px;background:var(--orange-soft);font-size:14px;margin:0}

/* Connexion */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login .side{background:var(--blue);color:var(--cream);padding:clamp(32px,6vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login .side img{height:40px;width:auto;align-self:flex-start}
.login .side h1{color:var(--cream);font-size:clamp(40px,6vw,76px);font-weight:800;line-height:.95}
.login .side p{max-width:40ch;color:#CFD6F5;font-size:17px;margin:14px 0 0}
.login .side small{color:#CFD6F5}
.login form{align-self:center;justify-self:center;width:min(420px,100%);padding:32px 20px;display:flex;flex-direction:column;gap:16px}
.login form h2{font-size:28px}
.login form p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:820px){.login{grid-template-columns:1fr}.login .side{padding-bottom:40px}}

/* Espace */
.bar{position:sticky;top:0;z-index:10;background:var(--blue);color:var(--cream)}
.bar .in{display:flex;align-items:center;gap:14px;height:60px;padding-inline:clamp(16px,3vw,32px)}
.bar img{height:28px;width:auto}
.bar b{font:700 17px var(--display);flex:1}
.bar button,.bar a{background:none;border:0;color:var(--cream);font:500 14px var(--text);opacity:.9;text-decoration:none}
.bar button:hover,.bar a:hover{opacity:1;text-decoration:underline}
.menu-btn{display:none}
.layout{display:grid;grid-template-columns:320px 1fr;min-height:calc(100% - 60px)}
nav.toc{background:#fff;border-right:1px solid var(--line);padding:24px 18px 40px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.prog{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.prog b{font:700 15px var(--display);color:var(--blue)}
.prog .track{height:8px;border-radius:99px;background:#E6E4F2;overflow:hidden}
.prog .fill{height:100%;background:var(--orange);width:0;transition:width .3s}
.prog span{font-size:13px;color:var(--muted)}
.mod{margin-bottom:16px}
.mod h3{font-size:14px;letter-spacing:.02em;margin-bottom:6px;color:var(--ink)}
.mod h3 small{display:block;font:600 11px var(--text);letter-spacing:.1em;text-transform:uppercase;color:#C26A12;margin-bottom:2px}
.les{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--ink);font-size:14.5px}
.les:hover{background:var(--paper)}
.les.cur{background:#E6ECFF;font-weight:600}
.les i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #C9CDE3;display:grid;place-items:center;font:700 11px/1 var(--text);font-style:normal;color:#fff}
.les.ok i{background:var(--ok);border-color:var(--ok)}
.toc .group{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:14px}

main.lesson{padding:clamp(24px,4vw,56px) clamp(16px,5vw,72px) 80px;max-width:900px}
.crumb{font:600 12px var(--text);letter-spacing:.1em;text-transform:uppercase;color:#C26A12}
main.lesson h1{font-size:clamp(30px,4vw,46px);font-weight:800;line-height:1.05;margin:6px 0 24px}
.video{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:var(--blue-deep);margin-bottom:28px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.body{font-size:17px;line-height:1.7;max-width:68ch}
.body h2{font-size:24px;margin:28px 0 8px}
.body h3{font-size:19px;margin:22px 0 6px}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:1.3em;margin:0 0 14px}
.body code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:.92em}
.body blockquote{margin:0 0 14px;padding:12px 16px;border-left:4px solid var(--orange);background:#fff;border-radius:0 8px 8px 0}
.res{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.res h3{font-size:17px;margin-bottom:10px}
.res button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 0;color:var(--blue);font-weight:600;text-align:left}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}
.welcome{background:var(--blue);color:var(--cream);border-radius:14px;padding:28px}
.welcome h1{color:var(--cream);margin:4px 0 10px}
.welcome p{margin:0;color:#CFD6F5;max-width:60ch}
.empty{padding:40px 0;color:var(--muted)}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav.toc{position:fixed;inset:60px 0 0 0;height:auto;z-index:9;display:none}
  nav.toc.open{display:block}
  .menu-btn{display:inline-block}
}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="side">
    <img src="__MONO__" alt="Maison Aria">
    <div>
      <h1>Aria Academy</h1>
      <p>La formation en ligne pour utiliser concrètement l'intelligence artificielle dans ton quotidien professionnel.</p>
    </div>
    <small>Pas encore d'accès ? <a href="/#cat-formations-ia" style="color:var(--orange)">Demande ton accès sur le site</a>.</small>
  </div>
  <form id="lform">
    <h2>Accéder à ma formation</h2>
    <p>Entre l'adresse e-mail et le code d'accès reçus par e-mail.</p>
    <label>E-mail<input id="l-email" type="email" autocomplete="email" required></label>
    <label>Code d'accès<input id="l-code" autocomplete="off" placeholder="ARIA-XXXX-XXXX" required style="text-transform:uppercase;letter-spacing:.05em"></label>
    <button class="btn" type="submit">Entrer</button>
    <p class="msg" id="l-msg" hidden></p>
  </form>
</div>

<div id="app" hidden>
  <header class="bar"><div class="in">
    <button class="menu-btn" type="button" id="menuBtn" aria-label="Afficher le sommaire">☰ Sommaire</button>
    <img src="__MONO__" alt="">
    <b id="cTitle">Aria Academy</b>
    <a href="/" >Site Maison Aria</a>
    <button type="button" id="logout">Se déconnecter</button>
  </div></header>
  <div class="layout">
    <nav class="toc" id="toc" aria-label="Sommaire de la formation"></nav>
    <main class="lesson" id="lesson"></main>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let AUTH = null, DATA = null, cur = null;
try { AUTH = JSON.parse(localStorage.getItem("ma-learner")); } catch(_) {}

async function call(extra){
  const r = await fetch("/api/course",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...AUTH,...extra})});
  const j = await r.json().catch(()=>({error:"Réponse illisible du serveur."}));
  if (!r.ok) throw new Error(j.error||"Erreur");
  return j;
}
async function enter(){
  DATA = await call({});
  $("login").hidden = true; $("app").hidden = false;
  $("cTitle").textContent = DATA.course.title;
  document.title = DATA.course.title + " · Espace formation";
  renderToc();
  const last = (()=>{ try { return localStorage.getItem("ma-last-lesson"); } catch(_) { return null; } })();
  const all = lessons();
  showLesson(all.find(l=>l.id===last) ? last : null);
}
$("lform").addEventListener("submit", async e=>{
  e.preventDefault();
  AUTH = { email:$("l-email").value.trim(), code:$("l-code").value.trim() };
  try { await enter(); try{ localStorage.setItem("ma-learner", JSON.stringify(AUTH)); }catch(_){} }
  catch(err){ $("l-msg").hidden=false; $("l-msg").textContent = err.message; }
});
$("logout").addEventListener("click",()=>{ try{localStorage.removeItem("ma-learner");}catch(_){} location.reload(); });
$("menuBtn").addEventListener("click",()=>$("toc").classList.toggle("open"));
if (AUTH) enter().catch(()=>{ $("login").hidden=false; });

const lessons = () => DATA.course.modules.flatMap((m,mi)=>m.lessons.map(l=>({...l, module:m.title, mi})));
const done = () => new Set(DATA.learner.done);

function renderToc(){
  const d = done(), all = lessons(), n = all.filter(l=>d.has(l.id)).length;
  const pct = all.length ? Math.round(n/all.length*100) : 0;
  $("toc").innerHTML = `
    <div class="prog"><b>Bonjour ${esc(DATA.learner.name||"")} 👋</b><div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <span>${n} / ${all.length} leçon${all.length>1?"s":""} terminée${n>1?"s":""} · ${pct} %</span></div>
    <button type="button" class="les${cur===null?" cur":""}" data-l=""><i>★</i>Accueil</button>
    ${DATA.course.modules.map((m,mi)=>`<div class="mod"><h3><small>Module ${mi+1}</small>${esc(m.title)}</h3>
      ${m.lessons.map(l=>`<button type="button" class="les${d.has(l.id)?" ok":""}${cur===l.id?" cur":""}" data-l="${l.id}"><i>${d.has(l.id)?"✓":""}</i>${esc(l.title)}</button>`).join("")}</div>`).join("")}
    ${DATA.course.groupUrl?`<div class="group">Des questions ? <a href="${esc(DATA.course.groupUrl)}" target="_blank" rel="noopener">Rejoindre le groupe d'accompagnement ↗</a></div>`:""}
    ${DATA.learner.expires?`<div class="group" style="color:var(--muted)">Accès valable jusqu'au ${new Date(DATA.learner.expires+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}</div>`:""}`;
}
$("toc").addEventListener("click",e=>{ const b=e.target.closest("[data-l]"); if(!b) return; showLesson(b.dataset.l||null); $("toc").classList.remove("open"); });

function embed(url){
  if(!url) return "";
  let m;
  if ((m = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/))) return `https://www.youtube-nocookie.com/embed/${m[1]}?rel=0`;
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/(\w+))?/))) return `https://player.vimeo.com/video/${m[1]}${m[2]?`?h=${m[2]}`:""}`;
  if ((m = url.match(/loom\.com\/share\/(\w+)/))) return `https://www.loom.com/embed/${m[1]}`;
  if (/^https:\/\//.test(url)) return url;
  return "";
}
function md(src){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<em>$2</em>").replace(/`(.+?)`/g,"<code>$1</code>")
    .replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  const out=[]; let list=null, para=[];
  const flushP=()=>{ if(para.length){ out.push(`<p>${para.map(inline).join("<br>")}</p>`); para=[]; } };
  const flushL=()=>{ if(list){ out.push(`<${list.t}>${list.items.map(i=>`<li>${inline(i)}</li>`).join("")}</${list.t}>`); list=null; } };
  for (const raw of String(src||"").split("\n")) {
    const line = raw.trimEnd(); let m;
    if (!line.trim()) { flushP(); flushL(); continue; }
    if ((m=line.match(/^(#{1,3})\s+(.*)/))) { flushP(); flushL(); const lv=m[1].length===1?2:3; out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); continue; }
    if ((m=line.match(/^>\s?(.*)/))) { flushP(); flushL(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); continue; }
    if ((m=line.match(/^\s*[-•]\s+(.*)/))) { flushP(); if(!list||list.t!=="ul"){flushL(); list={t:"ul",items:[]};} list.items.push(m[1]); continue; }
    if ((m=line.match(/^\s*\d+[.)]\s+(.*)/))) { flushP(); if(!list||list.t!=="ol"){flushL(); list={t:"ol",items:[]};} list.items.push(m[1]); continue; }
    flushL(); para.push(line);
  }
  flushP(); flushL(); return out.join("");
}

function showLesson(id){
  cur = id; window.scrollTo(0,0);
  try { if(id) localStorage.setItem("ma-last-lesson", id); } catch(_) {}
  const all = lessons(), L = $("lesson");
  if (!id) {
    const next = all.find(l=>!done().has(l.id));
    L.innerHTML = `<div class="welcome"><span class="crumb" style="color:var(--orange)">Espace formation</span><h1>${esc(DATA.course.title)}</h1><p>${esc(DATA.course.intro)}</p></div>
      ${all.length ? `<div class="foot" style="border:0"><span>${DATA.course.modules.length} module${DATA.course.modules.length>1?"s":""} · ${all.length} leçon${all.length>1?"s":""}</span>
      <button class="btn orange" type="button" data-go="${(next||all[0]).id}">${next && next!==all[0] ? "Reprendre ma formation →" : "Commencer la formation →"}</button></div>`
      : `<p class="empty">Les premières leçons arrivent très bientôt.</p>`}`;
    renderToc(); return;
  }
  const i = all.findIndex(l=>l.id===id), l = all[i]; if(!l) return showLesson(null);
  const src = embed(l.video), isDone = done().has(l.id);
  L.innerHTML = `<span class="crumb">Module ${l.mi+1} · ${esc(l.module)}</span><h1>${esc(l.title)}</h1>
    ${src?`<div class="video"><iframe src="${esc(src)}" title="Vidéo : ${esc(l.title)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`:""}
    <div class="body">${md(l.body)}</div>
    ${l.resources?.length?`<div class="res"><h3>Ressources</h3>${l.resources.map(r=>r.url
        ? `<a href="${esc(r.url)}" target="_blank" rel="noopener" style="display:block;padding:6px 0;font-weight:600">🔗 ${esc(r.name)}</a>`
        : `<button type="button" data-file="${esc(r.id)}" data-name="${esc(r.name)}">📄 ${esc(r.name)}</button>`).join("")}</div>`:""}
    <div class="foot">
      <button class="btn ghost" type="button" ${i>0?`data-go="${all[i-1].id}"`:"disabled"}>← Précédente</button>
      <button class="btn ${isDone?"done":""}" type="button" id="doneBtn">${isDone?"✓ Leçon terminée":"Marquer comme terminée"}</button>
      <button class="btn ghost" type="button" ${i<all.length-1?`data-go="${all[i+1].id}"`:"disabled"}>Suivante →</button>
    </div>`;
  $("doneBtn").addEventListener("click", async ()=>{
    const d = done(); d.has(l.id) ? d.delete(l.id) : d.add(l.id);
    DATA.learner.done = [...d];
    const moveOn = d.has(l.id) && i<all.length-1;
    try { await call({done:DATA.learner.done}); } catch(_) {}
    moveOn ? showLesson(all[i+1].id) : showLesson(l.id);
  });
  renderToc();
}
$("lesson").addEventListener("click", async e=>{
  const g = e.target.closest("[data-go]"); if (g) return showLesson(g.dataset.go);
  const f = e.target.closest("[data-file]"); if (!f) return;
  f.disabled = true; const label = f.textContent; f.textContent = "Téléchargement…";
  try {
    const r = await fetch("/api/course-file",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...AUTH,id:f.dataset.file})});
    if (!r.ok) throw new Error(await r.text());
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a"); a.href=url; a.download=f.dataset.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    f.textContent=label; } catch(err){ f.textContent = "Téléchargement impossible, réessaie"; setTimeout(()=>f.textContent=label,3000); }
  f.disabled=false;
});
</script>
</body>
</html>

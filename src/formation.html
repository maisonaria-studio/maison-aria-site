<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Aria Academy · Espace formation</title>
<link rel="icon" href="__MONO__">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Wix+Madefor+Display:wght@600;700;800&family=Wix+Madefor+Text:wght@400;500;600;700&display=swap">
<style>
:root{
  --blue:#0A22AE;--blue-deep:#071A8C;--blue-btn:#2F5FD8;--cream:#F4F1EA;--paper:#FBFAF6;--orange:#F0993F;--orange-soft:#FCE7CF;
  --ink:#16237A;--muted:#5561A8;--line:rgba(10,34,174,.14);--ok:#1E7B45;
  --display:"Wix Madefor Display","Helvetica Neue",Arial,sans-serif;--text:"Wix Madefor Text","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:16px/1.6 var(--text);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;color:var(--blue);text-wrap:balance}
button{font:inherit;cursor:pointer}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--orange);outline-offset:2px;border-radius:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font:600 15px var(--text);background:var(--blue);color:var(--cream);text-decoration:none}
.btn:hover{background:var(--blue-btn)}
.btn.ghost{background:transparent;color:var(--blue);border:1px solid var(--line)}
.btn.orange{background:var(--orange);color:var(--blue-deep)}
.btn.done{background:#E3F4E8;color:var(--ok)}
input{font:16px var(--text);color:var(--ink);background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:12px;width:100%}
input:focus{outline:none;border-color:var(--blue)}
label{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:14px}
.msg{padding:10px 14px;border-radius:8px;background:var(--orange-soft);font-size:14px;margin:0}

/* Connexion */
.login{min-height:100%;display:grid;grid-template-columns:1.1fr 1fr}
.login .side{background:var(--blue);color:var(--cream);padding:clamp(32px,6vw,72px);display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.login .side img{height:40px;width:auto;align-self:flex-start}
.login .side h1{color:var(--cream);font-size:clamp(40px,6vw,76px);font-weight:800;line-height:.95}
.login .side p{max-width:40ch;color:#CFD6F5;font-size:17px;margin:14px 0 0}
.login .side small{color:#CFD6F5}
.login form{align-self:center;justify-self:center;width:min(420px,100%);padding:32px 20px;display:flex;flex-direction:column;gap:16px}
.login form h2{font-size:28px}
.login form p{margin:0;color:var(--muted);font-size:15px}
@media (max-width:820px){.login{grid-template-columns:1fr}.login .side{padding-bottom:40px}}

/* Espace */
.bar{position:sticky;top:0;z-index:10;background:var(--blue);color:var(--cream)}
.bar .in{display:flex;align-items:center;gap:14px;height:60px;padding-inline:clamp(16px,3vw,32px)}
.bar img{height:28px;width:auto}
.bar b{font:700 17px var(--display);flex:1}
.bar button,.bar a{background:none;border:0;color:var(--cream);font:500 14px var(--text);opacity:.9;text-decoration:none}
.bar button:hover,.bar a:hover{opacity:1;text-decoration:underline}
.menu-btn{display:none}
.layout{display:grid;grid-template-columns:320px 1fr;min-height:calc(100% - 60px)}
nav.toc{background:#fff;border-right:1px solid var(--line);padding:24px 18px 40px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.prog{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.prog b{font:700 15px var(--display);color:var(--blue)}
.prog .track{height:8px;border-radius:99px;background:#E6E4F2;overflow:hidden}
.prog .fill{height:100%;background:var(--orange);width:0;transition:width .3s}
.prog span{font-size:13px;color:var(--muted)}
.mod{margin-bottom:16px}
.mod h3{font-size:14px;letter-spacing:.02em;margin-bottom:6px;color:var(--ink)}
.mod h3 small{display:block;font:600 11px var(--text);letter-spacing:.1em;text-transform:uppercase;color:#C26A12;margin-bottom:2px}
.les{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:8px 10px;color:var(--ink);font-size:14.5px}
.les:hover{background:var(--paper)}
.les.cur{background:#E6ECFF;font-weight:600}
.les i{flex:none;width:18px;height:18px;border-radius:50%;border:2px solid #C9CDE3;display:grid;place-items:center;font:700 11px/1 var(--text);font-style:normal;color:#fff}
.les.ok i{background:var(--ok);border-color:var(--ok)}
.toc .group{margin-top:20px;padding-top:16px;border-top:1px solid var(--line);font-size:14px}

main.lesson{padding:clamp(24px,4vw,56px) clamp(16px,5vw,72px) 80px;max-width:1320px}
main.lesson>h1,main.lesson>.crumb,main.lesson>.body,main.lesson>.res,main.lesson>.foot,main.lesson>.welcome{max-width:900px}
.crumb{font:600 12px var(--text);letter-spacing:.1em;text-transform:uppercase;color:#C26A12}
main.lesson h1{font-size:clamp(30px,4vw,46px);font-weight:800;line-height:1.05;margin:6px 0 24px}
.video{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:12px;overflow:hidden;background:var(--blue-deep);margin-bottom:28px}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video video{position:absolute;inset:0;width:100%;height:100%;background:#0A22AE;object-fit:contain}
.body{font-size:17px;line-height:1.7;max-width:68ch}
.body h2{font-size:24px;margin:28px 0 8px}
.body h3{font-size:19px;margin:22px 0 6px}
.body p{margin:0 0 14px}
.body ul,.body ol{padding-left:1.3em;margin:0 0 14px}
.body code{background:#fff;border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:.92em}
.body figure{margin:22px 0 26px;width:min(900px,calc(100vw - 40px))}
.body figure a{display:block;cursor:zoom-in}
.body figure img{display:block;width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff;box-shadow:0 8px 24px rgba(10,34,174,.08)}
.body figcaption{font-size:14px;line-height:1.45;color:var(--muted);margin-top:8px}
.body figcaption b{color:var(--orange)}
.body .tbl{overflow-x:auto;margin:0 0 18px;width:min(900px,calc(100vw - 40px))}
.body table{border-collapse:collapse;font-size:15px;line-height:1.45;background:#fff;border-radius:10px;overflow:hidden;min-width:560px;width:100%}
.body th{background:var(--blue,#0A22AE);color:#fff;text-align:left;padding:9px 12px;font-size:13px;letter-spacing:.02em}
.body td{padding:9px 12px;border-top:1px solid var(--line);vertical-align:top}
.body blockquote{margin:0 0 14px;padding:12px 16px;border-left:4px solid var(--orange);background:#fff;border-radius:0 8px 8px 0}
.res{margin-top:28px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.res h3{font-size:17px;margin-bottom:10px}
.res button{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 0;color:var(--blue);font-weight:600;text-align:left}
.foot{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-top:36px;padding-top:24px;border-top:1px solid var(--line)}
.welcome{background:var(--blue);color:var(--cream);border-radius:14px;padding:28px}
.welcome h1{color:var(--cream);margin:4px 0 10px}
.welcome p{margin:0;color:#CFD6F5;max-width:60ch}
.empty{padding:40px 0;color:var(--muted)}

/* Quiz et attestation */
.les.quiz i{border-color:var(--orange);color:var(--orange)}
.les.quiz.ok i{background:var(--orange);border-color:var(--orange);color:#fff}
.les small{margin-left:auto;font-size:12px;color:var(--muted)}
.toc .final{margin-top:18px;padding-top:14px;border-top:1px solid var(--line)}
.quiz{max-width:820px}
.qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px 22px;margin:0 0 16px}
.qcard h3{font-size:18px;line-height:1.35;margin:0 0 12px}
.qcard h3 span{color:#C26A12;font:700 13px var(--text);display:block;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.qopt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;margin:8px 0;cursor:pointer;font-size:16px;line-height:1.4}
.qopt:hover{border-color:#B8C2F0}
.qopt{flex-direction:row!important;font-weight:500}
.qopt input{flex:none;width:18px!important;height:18px;margin:2px 0 0;padding:0;accent-color:var(--blue);box-shadow:none}
.qopt.good{border-color:var(--ok);background:#EAF7EE}
.qopt.bad{border-color:#D9534F;background:#FCEDEC}
.qexp{margin-top:10px;font-size:15px;line-height:1.5;color:var(--ink);background:var(--paper);border-radius:8px;padding:10px 12px}
.qexp b{color:var(--blue)}
.score{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--blue);color:var(--cream);border-radius:14px;padding:22px 24px;margin:0 0 22px}
.score b{font:800 40px var(--display);color:var(--orange)}
.score p{margin:0;color:#CFD6F5;max-width:46ch}
.checks{list-style:none;padding:0;margin:0 0 22px;display:grid;gap:10px;max-width:820px}
.checks li{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:16px}
.checks li i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;color:#fff;background:#C9CDE3}
.checks li.ok i{background:var(--ok)}
.cert{width:min(1000px,100%);aspect-ratio:1.414/1;background:#fff;border-radius:6px;box-shadow:0 20px 50px rgba(10,34,174,.18);position:relative;overflow:hidden;color:var(--blue);margin:10px 0 24px}
.cert .band{position:absolute;left:0;top:0;bottom:0;width:23%;background:var(--blue);display:flex;flex-direction:column;justify-content:space-between;padding:6% 4%}
.cert .band img{width:72%}
.cert .band small{color:#CFD6F5;font-size:clamp(8px,1.1vw,12px);line-height:1.5}
.cert .band::after{content:"";position:absolute;right:-6px;top:0;bottom:0;width:6px;background:var(--orange)}
.cert .ct{position:absolute;left:29%;right:6%;top:8%;bottom:8%;display:flex;flex-direction:column}
.cert .kick{font:700 clamp(9px,1.2vw,13px) var(--text);letter-spacing:.22em;text-transform:uppercase;color:#C26A12}
.cert h2{font:800 clamp(24px,4.4vw,48px)/1 var(--display);margin:2% 0 4%}
.cert .who{font:800 clamp(22px,3.8vw,42px)/1.05 var(--display);color:var(--ink);margin:1% 0 2%}
.cert p{font-size:clamp(10px,1.45vw,16px);line-height:1.5;color:#2B3A9A;margin:0 0 1.5%;max-width:60ch}
.cert .meta{margin-top:auto;display:flex;justify-content:space-between;gap:20px;font-size:clamp(9px,1.2vw,13px);color:#2B3A9A;border-top:1px solid #E1DCCF;padding-top:2.5%}
.cert .meta b{display:block;color:var(--blue);font-size:1.15em}
@media print{
  body *{visibility:hidden!important}
  .cert,.cert *{visibility:visible!important}
  .cert{position:fixed;left:0;top:0;width:297mm;height:210mm;margin:0;box-shadow:none;border-radius:0;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4 landscape;margin:0}
}
@media (max-width:900px){
  .layout{grid-template-columns:1fr}
  nav.toc{position:fixed;inset:60px 0 0 0;height:auto;z-index:9;display:none}
  nav.toc.open{display:block}
  .menu-btn{display:inline-block}
}
@media (max-width:560px){header.bar .in>a{display:none}header.bar #cTitle{font-size:16px}header.bar .in{gap:10px}}
</style>
</head>
<body>

<div class="login" id="login">
  <div class="side">
    <img src="__MONO__" alt="Maison Aria">
    <div>
      <h1>Aria Academy</h1>
      <p>La formation en ligne pour utiliser concrètement l'intelligence artificielle dans ton quotidien professionnel.</p>
    </div>
    <small>Pas encore d'accès ? <a href="/#cat-formations-ia" style="color:var(--orange)">Demande ton accès sur le site</a>.</small>
  </div>
  <form id="lform">
    <h2>Accéder à ma formation</h2>
    <p>Entre l'adresse e-mail et le code d'accès reçus par e-mail.</p>
    <label>E-mail<input id="l-email" type="email" autocomplete="email" required></label>
    <label>Code d'accès<input id="l-code" autocomplete="off" placeholder="ARIA-XXXX-XXXX" required style="text-transform:uppercase;letter-spacing:.05em"></label>
    <button class="btn" type="submit">Entrer</button>
    <p class="msg" id="l-msg" hidden></p>
  </form>
</div>

<div id="app" hidden>
  <header class="bar"><div class="in">
    <button class="menu-btn" type="button" id="menuBtn" aria-label="Afficher le sommaire">☰ Sommaire</button>
    <img src="__MONO__" alt="">
    <b id="cTitle">Aria Academy</b>
    <a href="/" >Site Maison Aria</a>
    <button type="button" id="logout">Se déconnecter</button>
  </div></header>
  <div class="layout">
    <nav class="toc" id="toc" aria-label="Sommaire de la formation"></nav>
    <main class="lesson" id="lesson"></main>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let AUTH = null, DATA = null, cur = null;
try { AUTH = JSON.parse(localStorage.getItem("ma-learner")); } catch(_) {}

async function call(extra){
  const r = await fetch("/api/course",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...AUTH,...extra})});
  const j = await r.json().catch(()=>({error:"Réponse illisible du serveur."}));
  if (!r.ok) throw new Error(j.error||"Erreur");
  return j;
}
async function enter(){
  DATA = await call({});
  $("login").hidden = true; $("app").hidden = false;
  $("cTitle").textContent = DATA.course.title;
  document.title = DATA.course.title + " · Espace formation";
  renderToc();
  const last = (()=>{ try { return localStorage.getItem("ma-last-lesson"); } catch(_) { return null; } })();
  const all = lessons();
  showLesson(all.find(l=>l.id===last) ? last : null);
}
$("lform").addEventListener("submit", async e=>{
  e.preventDefault();
  AUTH = { email:$("l-email").value.trim(), code:$("l-code").value.trim() };
  try { await enter(); try{ localStorage.setItem("ma-learner", JSON.stringify(AUTH)); }catch(_){} }
  catch(err){ $("l-msg").hidden=false; $("l-msg").textContent = err.message; }
});
$("logout").addEventListener("click",()=>{ try{localStorage.removeItem("ma-learner");}catch(_){} location.reload(); });
$("menuBtn").addEventListener("click",()=>$("toc").classList.toggle("open"));
if (AUTH) enter().catch(()=>{ $("login").hidden=false; });

const lessons = () => DATA.course.modules.flatMap((m,mi)=>m.lessons.map((l,li)=>({...l, module:m.title, mi, li})));
const done = () => new Set(DATA.learner.done);
const quizOf = k => k==="final" ? DATA.course.final : DATA.course.quizzes?.[k];
const qz = k => DATA.learner.quiz?.[k] || {};

function renderToc(){
  const d = done(), all = lessons(), n = all.filter(l=>d.has(l.id)).length;
  const pct = all.length ? Math.round(n/all.length*100) : 0;
  $("toc").innerHTML = `
    <div class="prog"><b>Bonjour ${esc(DATA.learner.name||"")} 👋</b><div class="track"><div class="fill" style="width:${pct}%"></div></div>
    <span>${n} / ${all.length} leçon${all.length>1?"s":""} terminée${n>1?"s":""} · ${pct} %</span></div>
    <button type="button" class="les${cur===null?" cur":""}" data-l=""><i>★</i>Accueil</button>
    ${DATA.course.modules.map((m,mi)=>`<div class="mod"><h3><small>Module ${mi+1}</small>${esc(m.title)}</h3>
      ${m.lessons.map(l=>`<button type="button" class="les${d.has(l.id)?" ok":""}${cur===l.id?" cur":""}" data-l="${l.id}"><i>${d.has(l.id)?"✓":""}</i>${esc(l.title)}</button>`).join("")}
      ${quizOf(m.id)?`<button type="button" class="les quiz${qz(m.id).passed?" ok":""}${cur==="q:"+m.id?" cur":""}" data-l="q:${m.id}"><i>${qz(m.id).passed?"✓":"?"}</i>Quiz du module${qz(m.id).best!=null?`<small>${qz(m.id).best} %</small>`:""}</button>`:""}</div>`).join("")}
    ${DATA.course.final?.length?`<div class="mod final"><h3><small>Validation</small>Évaluation et attestation</h3>
      <button type="button" class="les quiz${qz("final").passed?" ok":""}${cur==="q:final"?" cur":""}" data-l="q:final"><i>${qz("final").passed?"✓":"?"}</i>Évaluation finale${qz("final").best!=null?`<small>${qz("final").best} %</small>`:""}</button>
      <button type="button" class="les${DATA.learner.certificate?" ok":""}${cur==="cert"?" cur":""}" data-l="cert"><i>${DATA.learner.certificate?"✓":"🎓"}</i>Mon attestation</button></div>`:""}
    ${DATA.course.groupUrl?`<div class="group">Des questions ? <a href="${esc(DATA.course.groupUrl)}" target="_blank" rel="noopener">Rejoindre le groupe d'accompagnement ↗</a></div>`:""}
    ${DATA.learner.expires?`<div class="group" style="color:var(--muted)">Accès valable jusqu'au ${new Date(DATA.learner.expires+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}</div>`:""}`;
}
$("toc").addEventListener("click",e=>{ const b=e.target.closest("[data-l]"); if(!b) return; showLesson(b.dataset.l||null); $("toc").classList.remove("open"); });

function embed(url){
  if(!url) return "";
  let m;
  if ((m = url.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([\w-]{6,})/))) return `https://www.youtube-nocookie.com/embed/${m[1]}?rel=0`;
  if ((m = url.match(/vimeo\.com\/(?:video\/)?(\d+)(?:\/(\w+))?/))) return `https://player.vimeo.com/video/${m[1]}${m[2]?`?h=${m[2]}`:""}`;
  if ((m = url.match(/loom\.com\/share\/(\w+)/))) return `https://www.loom.com/embed/${m[1]}`;
  if (/^https:\/\//.test(url) || /^\/formation\/videos\//.test(url)) return url;
  return "";
}
function md(src){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*(?!\s)(.+?)\*/g,"$1<em>$2</em>").replace(/`(.+?)`/g,"<code>$1</code>")
    .replace(/\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>')
    .replace(/\[(.+?)\]\((\/formation\/[^\s)]+)\)/g,(_,t,u)=>`<a href="${u}" target="_blank" rel="noopener"${/\.(json|pdf)$/.test(u)?" download":""}>${t}</a>`);
  const out=[]; let list=null, para=[], tbl=null;
  const flushT=()=>{ if(tbl){ const rows=tbl.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r)).map(r=>r.replace(/^\s*\||\|\s*$/g,"").split("|").map(c=>c.trim()));
    const [h,...b]=rows; out.push(`<div class="tbl"><table><thead><tr>${h.map(c=>`<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${b.map(r=>`<tr>${r.map(c=>`<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`); tbl=null; } };
  const flushP=()=>{ if(para.length){ out.push(`<p>${para.map(inline).join("<br>")}</p>`); para=[]; } };
  const flushL=()=>{ if(list){ out.push(`<${list.t}>${list.items.map(i=>`<li>${inline(i)}</li>`).join("")}</${list.t}>`); list=null; } };
  for (const raw of String(src||"").split("\n")) {
    const line = raw.trimEnd(); let m;
    if (/^\s*\|.*\|\s*$/.test(line)) { flushP(); flushL(); (tbl=tbl||[]).push(line); continue; }
    flushT();
    if (!line.trim()) { flushP(); flushL(); continue; }
    if ((m=line.match(/^!\[(.*?)\]\((\/formation\/[^\s)]+|https:\/\/[^\s)]+)\)\s*$/))) { flushP(); flushL();
      const num=(m[1].match(/^(\d+)\s*[·.]\s*/)||[])[1], txt=m[1].replace(/^\d+\s*[·.]\s*/,"");
      out.push(`<figure><a href="${esc(m[2])}" target="_blank" rel="noopener" title="Agrandir la capture"><img src="${esc(m[2])}" alt="${esc(txt.replace(/\*/g,""))}" loading="lazy"></a>${m[1]?`<figcaption>${num?`<b>Capture ${num} ·</b> `:""}${inline(txt)}</figcaption>`:""}</figure>`); continue; }
    if ((m=line.match(/^(#{1,3})\s+(.*)/))) { flushP(); flushL(); const lv=m[1].length===1?2:3; out.push(`<h${lv}>${inline(m[2])}</h${lv}>`); continue; }
    if ((m=line.match(/^>\s?(.*)/))) { flushP(); flushL(); out.push(`<blockquote>${inline(m[1])}</blockquote>`); continue; }
    if ((m=line.match(/^\s*[-•]\s+(.*)/))) { flushP(); if(!list||list.t!=="ul"){flushL(); list={t:"ul",items:[]};} list.items.push(m[1]); continue; }
    if ((m=line.match(/^\s*\d+[.)]\s+(.*)/))) { flushP(); if(!list||list.t!=="ol"){flushL(); list={t:"ol",items:[]};} list.items.push(m[1]); continue; }
    flushL(); para.push(line);
  }
  flushT(); flushP(); flushL(); return out.join("");
}

function showLesson(id){
  if (id && id.startsWith("q:")) return showQuiz(id.slice(2));
  if (id === "cert") return showCert();
  cur = id; window.scrollTo(0,0);
  try { if(id) localStorage.setItem("ma-last-lesson", id); } catch(_) {}
  const all = lessons(), L = $("lesson");
  if (!id) {
    const next = all.find(l=>!done().has(l.id));
    L.innerHTML = `<div class="welcome"><span class="crumb" style="color:var(--orange)">Espace formation</span><h1>${esc(DATA.course.title)}</h1><p>${esc(DATA.course.intro)}</p></div>
      ${all.length ? `<div class="foot" style="border:0"><span>${DATA.course.modules.length} module${DATA.course.modules.length>1?"s":""} · ${all.length} leçon${all.length>1?"s":""}</span>
      <button class="btn orange" type="button" data-go="${(next||all[0]).id}">${next && next!==all[0] ? "Reprendre ma formation →" : "Commencer la formation →"}</button></div>`
      : `<p class="empty">Les premières leçons arrivent très bientôt.</p>`}
      ${(()=>{ const seen=new Set(), res=all.flatMap(l=>(l.resources||[]).filter(r=>r.url&&!seen.has(r.url)&&seen.add(r.url)).map(r=>({...r,lesson:l})));
        return res.length?`<div class="res"><h3>Toutes les fiches pratiques (${res.length})</h3>${res.map(r=>`<a href="${esc(r.url)}" target="_blank" rel="noopener" style="display:block;padding:6px 0;font-weight:600">📄 ${esc(r.name)} <span style="font-weight:400;opacity:.7">· leçon ${r.lesson.mi+1}.${r.lesson.li+(DATA.course.modules[r.lesson.mi].lessons[0]?.id.endsWith("l0")?0:1)}</span></a>`).join("")}</div>`:""; })()}`;
    renderToc(); return;
  }
  const i = all.findIndex(l=>l.id===id), l = all[i]; if(!l) return showLesson(null);
  const src = embed(l.video), isDone = done().has(l.id);
  L.innerHTML = `<span class="crumb">Module ${l.mi+1} · ${esc(l.module)}</span><h1>${esc(l.title)}</h1>
    ${src?(/\.mp4(\?|$)/.test(src)
      ? `<div class="video"><video src="${esc(src)}" poster="${esc(src.replace(/\.mp4(\?.*)?$/,".jpg"))}" controls playsinline preload="metadata" controlslist="nodownload" disablepictureinpicture oncontextmenu="return false" title="Vidéo : ${esc(l.title)}"></video></div>`
      : `<div class="video"><iframe src="${esc(src)}" title="Vidéo : ${esc(l.title)}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`):""}
    <div class="body">${md(l.body)}</div>
    ${l.resources?.length?`<div class="res"><h3>Ressources</h3>${l.resources.map(r=>r.url
        ? `<a href="${esc(r.url)}" target="_blank" rel="noopener" style="display:block;padding:6px 0;font-weight:600">🔗 ${esc(r.name)}</a>`
        : `<button type="button" data-file="${esc(r.id)}" data-name="${esc(r.name)}">📄 ${esc(r.name)}</button>`).join("")}</div>`:""}
    <div class="foot">
      <button class="btn ghost" type="button" ${i>0?`data-go="${all[i-1].id}"`:"disabled"}>← Précédente</button>
      <button class="btn ${isDone?"done":""}" type="button" id="doneBtn">${isDone?"✓ Leçon terminée":"Marquer comme terminée"}</button>
      ${(()=>{ const last = i===all.length-1 || all[i+1].mi!==l.mi, mid = DATA.course.modules[l.mi].id;
        return last && quizOf(mid) ? `<button class="btn orange" type="button" data-go="q:${mid}">Quiz du module →</button>`
          : `<button class="btn ghost" type="button" ${i<all.length-1?`data-go="${all[i+1].id}"`:"disabled"}>Suivante →</button>`; })()}
    </div>`;
  $("doneBtn").addEventListener("click", async ()=>{
    const d = done(); d.has(l.id) ? d.delete(l.id) : d.add(l.id);
    DATA.learner.done = [...d];
    const lastOfMod = i===all.length-1 || all[i+1].mi!==l.mi, mid = DATA.course.modules[l.mi].id;
    const moveOn = d.has(l.id) && i<all.length-1;
    try { await call({done:DATA.learner.done}); } catch(_) {}
    if (d.has(l.id) && lastOfMod && quizOf(mid) && !qz(mid).passed) return showQuiz(mid);
    moveOn ? showLesson(all[i+1].id) : showLesson(l.id);
  });
  renderToc();
}

function showQuiz(key, result){
  cur = "q:"+key; window.scrollTo(0,0);
  const list = quizOf(key); if (!list) return showLesson(null);
  const mi = DATA.course.modules.findIndex(m=>m.id===key), isFinal = key==="final";
  const pass = isFinal ? DATA.course.pass.final : DATA.course.pass.quiz, q = qz(key);
  const title = isFinal ? "Évaluation finale" : "Quiz · " + DATA.course.modules[mi].title;
  const next = isFinal ? null : DATA.course.modules[mi+1];
  const L = $("lesson");
  L.innerHTML = `<span class="crumb">${isFinal?"Validation de la formation":"Module "+(mi+1)+" · fin de module"}</span><h1>${esc(title)}</h1>
    ${result ? `<div class="score"><div><b>${result.score} %</b></div><p>${result.passed ? (isFinal?"Bravo, évaluation réussie ! Tu peux maintenant obtenir ton attestation.":"Bravo, module validé !") : `Il faut ${pass} % pour valider. Relis les explications ci-dessous, puis retente ta chance.`}</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${result.passed?"":`<button class="btn" type="button" data-go="q:${key}">Recommencer</button>`}
      ${result.passed ? (isFinal?`<button class="btn orange" type="button" data-go="cert">Mon attestation →</button>`: next?`<button class="btn orange" type="button" data-go="${next.lessons[0].id}">Module suivant →</button>`:`<button class="btn orange" type="button" data-go="q:final">Évaluation finale →</button>`) : ""}</div></div>`
      : `<div class="body" style="margin-bottom:18px"><p>${list.length} questions · il faut <strong>${pass} %</strong> de bonnes réponses pour valider${q.best!=null?` · ton meilleur score : <strong>${q.best} %</strong>`:""}. Tu peux recommencer autant de fois que tu veux : les explications s'affichent après chaque tentative.</p></div>`}
    <form class="quiz" id="qform">${list.map((x,qi)=>{ const r = result?.res[qi];
      return `<div class="qcard"><h3><span>Question ${qi+1}</span>${esc(x.q)}</h3>${x.o.map((o,oi)=>`<label class="qopt${r?(oi===r.a?" good":(result.answers[qi]===oi?" bad":"")):""}"><input type="radio" name="q${qi}" value="${oi}" ${r?"disabled":""} ${result?.answers[qi]===oi?"checked":""} required> <span>${esc(o)}</span></label>`).join("")}
        ${r?`<div class="qexp"><b>${r.ok?"✓ Bonne réponse.":"✗ À revoir."}</b> ${esc(r.e)}</div>`:""}</div>`; }).join("")}
      ${result?"":`<div class="foot"><span style="color:var(--muted)">Réponds à toutes les questions.</span><button class="btn orange" type="submit">Valider mes réponses</button></div>`}
    </form>`;
  if (!result) $("qform").addEventListener("submit", async e=>{
    e.preventDefault();
    const answers = list.map((_,qi)=>Number(new FormData(e.target).get("q"+qi)));
    const btn = e.target.querySelector("[type=submit]"); btn.disabled = true; btn.textContent = "Correction…";
    try { const r = await call({action:"quiz", module:key, answers}); DATA.learner.quiz = r.quiz; showQuiz(key, {...r, answers}); }
    catch(err){ btn.disabled=false; btn.textContent="Valider mes réponses"; alert(err.message); }
  });
  renderToc();
}

async function showCert(){
  cur = "cert"; window.scrollTo(0,0);
  const all = lessons(), d = done(), nDone = all.filter(l=>d.has(l.id)).length;
  const mods = DATA.course.modules.filter(m=>quizOf(m.id)), nQuiz = mods.filter(m=>qz(m.id).passed).length;
  const finalOk = !!qz("final").passed, ok = nDone===all.length && nQuiz===mods.length && finalOk;
  const L = $("lesson"), c = DATA.learner.certificate;
  const certHtml = c => `<div class="cert" id="cert"><div class="band"><img src="__MONO__" alt="Maison Aria"><small>Maison Aria<br>Golfe de Saint-Tropez<br>maisonaria-studio.com</small></div>
    <div class="ct"><span class="kick">Attestation de réussite</span><h2>Aria Academy</h2><p>Maison Aria atteste que</p><div class="who">${esc(c.name)}</div>
    <p>a suivi l'intégralité de la formation en ligne <strong>« Automatiser et processiser son entreprise avec l'IA »</strong> (${DATA.course.modules.length} modules, ${all.length} leçons), validé les ${mods.length} quiz de fin de module et réussi l'évaluation finale.</p>
    <p>Compétences : comprendre l'IA et ses limites, cartographier et documenter ses processus, utiliser les assistants IA, créer des automatisations sans code, connecter l'IA à ses outils, mesurer les gains.</p>
    <div class="meta"><span>Délivrée le<b>${new Date(c.date+"T12:00:00").toLocaleDateString("fr-FR",{day:"numeric",month:"long",year:"numeric"})}</b></span><span>Score moyen<b>${c.average} %</b></span><span>N° d'attestation<b>${esc(c.id)}</b></span><span>Vérifier<b>maisonaria-studio.com/formation/verifier</b></span></div></div></div>`;
  L.innerHTML = `<span class="crumb">Validation de la formation</span><h1>Mon attestation</h1>
    ${c ? certHtml(c) + `<div class="foot" style="max-width:1000px"><span style="color:var(--muted)">Astuce : dans la fenêtre d'impression, choisis « Enregistrer au format PDF ».</span><button class="btn orange" type="button" id="printCert">Télécharger / imprimer (PDF)</button></div>`
      : `<div class="body"><p>Ton attestation se débloque quand les trois conditions sont remplies :</p></div>
        <ul class="checks"><li class="${nDone===all.length?"ok":""}"><i>${nDone===all.length?"✓":""}</i>Toutes les leçons terminées · ${nDone} / ${all.length}</li>
        <li class="${nQuiz===mods.length?"ok":""}"><i>${nQuiz===mods.length?"✓":""}</i>Tous les quiz de module validés · ${nQuiz} / ${mods.length}</li>
        <li class="${finalOk?"ok":""}"><i>${finalOk?"✓":""}</i>Évaluation finale réussie${qz("final").best!=null?` · meilleur score ${qz("final").best} %`:""}</li></ul>
        <div class="foot" style="max-width:820px">${ok?`<span>Tout est validé, bravo !</span><button class="btn orange" type="button" id="getCert">Obtenir mon attestation</button>`
          : `<span style="color:var(--muted)">Continue ta formation : tu y es presque.</span><button class="btn" type="button" data-go="${(all.find(l=>!d.has(l.id))||{}).id || (mods.find(m=>!qz(m.id).passed)?"q:"+mods.find(m=>!qz(m.id).passed).id:"q:final")}">Continuer →</button>`}</div>`}`;
  $("printCert")?.addEventListener("click",()=>window.print());
  $("getCert")?.addEventListener("click", async e=>{ e.target.disabled=true; e.target.textContent="Création…";
    try { const r = await call({action:"certificate"}); DATA.learner.certificate = r.certificate; showCert(); }
    catch(err){ e.target.disabled=false; e.target.textContent="Obtenir mon attestation"; alert(err.message); } });
  renderToc();
}

$("lesson").addEventListener("click", async e=>{
  const g = e.target.closest("[data-go]"); if (g) return showLesson(g.dataset.go);
  const f = e.target.closest("[data-file]"); if (!f) return;
  f.disabled = true; const label = f.textContent; f.textContent = "Téléchargement…";
  try {
    const r = await fetch("/api/course-file",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...AUTH,id:f.dataset.file})});
    if (!r.ok) throw new Error(await r.text());
    const url = URL.createObjectURL(await r.blob());
    const a = document.createElement("a"); a.href=url; a.download=f.dataset.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    f.textContent=label; } catch(err){ f.textContent = "Téléchargement impossible, réessaie"; setTimeout(()=>f.textContent=label,3000); }
  f.disabled=false;
});
</script>
